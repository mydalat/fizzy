# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"

  # CHIPVN: keys here are the minimum English overrides needed for upstream tests
  # to pass. They mirror the vi.yml keys that test/* asserts against. Missing
  # keys fall back to :vi (see config/environments/test.rb).
  signups:
    join_codes:
      code_inactive:
        title: "That code is all used up"

  cards:
    delete:
      button: "Delete this card"

  boards:
    access:
      select_all: "Select all"
      select_none: "Select none"

  users:
    email_change:
      link_expired_title: "Link expired"

  account:
    export:
      expired_title: "Download Expired"

  activerecord:
    errors:
      models:
        user:
          attributes:
            name:
              blank: "can't be blank"

  notifications:
    body:
      assigned_to: "Assigned to %{assignees}"
      self: "self"
      unassigned_by: "Unassigned by %{creator}"
      added_by: "Added by %{creator}"
      moved_to_done: "Moved to Done by %{creator}"
      reopened_by: "Reopened by %{creator}"
      moved_to_not_now: "Moved to Not Now by %{creator}"
      auto_postponed: "Moved to Not Now due to inactivity"
      renamed_by: "Renamed by %{creator}"
      moved_by: "Moved by %{creator}"
      moved_to_column: "Moved to %{column} by %{creator}"
      moved_back_to_triage: "Moved back to Maybe? by %{creator}"
      mentioned_you: "%{name} @mentioned you"
      card_number: "Card %{number}"

    buttons:
      mark_read: "Mark as read"
      mark_unread: "Mark as unread"

    frequency:
      never: "Never"
      every_few_hours: "Every few hours"
      daily: "Every day"
      weekly: "Every week"
